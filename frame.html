<!DOCTYPE html>
<html>
<head>
    <title>My School</title>

    <style>
        body {
            font-family: Arial;
            margin: 8px;
        }

        .header {
            background-color: lightblue;
            text-align: center;
            padding: 15px;
        }

        .main {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .left {
            background-color: lightyellow;
            width: 25%;
            padding: 10px;
        }

        .right {
            background-color: lightgreen;
            width: 75%;
            padding: 10px;
        }

        .footer {
            background-color: lightpink;
            text-align: center;
            padding: 10px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        HOME | ABOUT | SERVICES | CONTACT
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Left Section -->
        <div class="left">
            <h3>Subjects</h3>
            <p>English</p>
            <p>Maths</p>
            <p>Science</p>
            <p>Social</p>
            Left - 25%
        </div>

        <!-- Right Section -->
        <div class="right">
            <h3>About Our School</h3>
            <p>Welcome to Our School</p>
            <p>We provide quality education.</p>
            <p>We encourage sports and activities.</p>
            Right - 75%
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <h3>© 2026 My School</h3>
        Footer - 10%
    </div>

</body>
</html>
