
<!DOCTYPE html>
<html>
<head>
    <title>WWW.FF  Registration Form  WWW</title>
</head>
<body>

<h2>FF Community Registration Form KLU</h2>
<h3> It is mandatory to fill all your details 
    <br> Instructions from higher authorities </h3>

<form action="#" method="post">

    <fieldset>
        <legend>Personal Information</legend>

      
        <input type="text" name="name" placeholder="Enter Name" required>
        <br><br>

        <label>Enter UID:</label>
        <input type="password" name="password" placeholder="Enter Password">
        <br><br>

        <label>Enter FF Email:</label>
        <input type="email" name="email" placeholder="Enter Email">
        <br><br>

        <label>Mobile Number:</label>
        <input type="tel" name="mobile" placeholder="Enter Mobile Number">
        <br><br>

        <label>HOW many years old:</label>
        <input type="number" name="age" min="1" max="15" ">
        <br><br>

        <label>Date of Birth your account  :</label>
        <input type="date" name="dob">
        <br><br>

        <label>how much you play frire daily:</label>
        <input type="time" name="time">
        <br><br>

        <
        <label>Entering month:</label>
        <input type="month" name="month">
        <br><br>

        <label>Every week:</label>
        <input type="time" name="time">
        <br><br>

        <label>Website:</label>
        <input type="url" name="website" placeholder="Enter Website URL">
        <br><br>

        <label>Search:</label>
        <input type="search" name="search" placeholder="Search here">
        <br><br>

        <label>Favorite Color:</label>
        <input type="color" name="color">
        <br><br>

        <label>Upload Photo:</label>
        <input type="file" name="photo">
        <br><br>

        <label>Skill Level:</label>
        <input type="range" name="skill" min="0" max="100">
        <br><br>

    </fieldset>

    <br>

    <fieldset>
        <legend>Academic Information</legend>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Skills:</label>
        <input type="checkbox" name="skills" value="Java"> Java
        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="HTML"> HTML
        <br><br>

        <label>Department:</label>
        <select name="department">
            <option value="">Select Department</option>
            <optgroup label="Engineering">
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
            </optgroup>
            <optgroup label="Other">
                <option>MBA</option>
                <option>MCA</option>
            </optgroup>
        </select>
        <br><br>

        <label>City:</label>
        <input list="cities" name="city" placeholder="Enter City">
        <datalist id="cities">
            <option value="Hyderabad">
            <option value="Vijayawada">
            <option value="Guntur">
            <option value="Chennai">
        </datalist>
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="40"
                  placeholder="Enter Address"></textarea>
        <br><br>

        <label>Roll Number (Readonly):</label>
        <input type="text" value="2300030001" readonly>
        <br><br>

        <label>College Code (Disabled):</label>
        <input type="text" value="KLU" disabled>
        <br><br>

        <input type="hidden" name="college" value="KLU">

    </fieldset>

    <br>

    <fieldset>
        <legend>Form Actions</legend>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">

        <input type="button" value="Click Me"
               onclick="alert('Welcome to HTML Forms!')">

        <button type="button">Normal Button</button>
    </fieldset>
</form>
</body>
</html>
